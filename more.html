<script>
  const base = "https://cdn.jsdelivr.net/gh/placeholdersystems/pls-website-hf@main/";

  async function include(id, file) {
    const res = await fetch(base + file);
    if (!res.ok) throw new Error(file + " failed: " + res.status);
    document.getElementById(id).innerHTML = await res.text();
  }

  Promise.allSettled([
  include("site-header", "header.html"),
  include("site-footer", "footer.html")
]).then(() => {
  const y = document.getElementById("footer-year");
  if (y) y.textContent = new Date().getFullYear();

  const s = document.createElement("script");
  s.src = base + "shared.js";
  document.body.appendChild(s);
});
</script>

<script>

});
   // Only one dropdown open at a time
document.querySelectorAll('.nav-dropdown').forEach(dropdown => {
  const btn = dropdown.querySelector('.nav-dropdown-button');
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = dropdown.classList.contains('open');

    document.querySelectorAll('.nav-dropdown.open').forEach(other => {
      other.classList.remove('open');
      other.querySelector('.nav-dropdown-button').setAttribute('aria-expanded', 'false');
    });

    if (!isOpen) {
      dropdown.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
    }
  });
});

document.addEventListener('click', (e) => {
  document.querySelectorAll('.nav-dropdown.open').forEach(dropdown => {
    if (!dropdown.contains(e.target)) {
      dropdown.classList.remove('open');
      dropdown.querySelector('.nav-dropdown-button').setAttribute('aria-expanded', 'false');
    }
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.nav-dropdown.open').forEach(dropdown => {
      dropdown.classList.remove('open');
      dropdown.querySelector('.nav-dropdown-button').setAttribute('aria-expanded', 'false');
    });
  }
});

</script>
