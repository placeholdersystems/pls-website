<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign-In Example</title>
    
    <script src="https://google.com" async defer></script>
</head>
<body>

    <h1>Log In to Your Account</h1>

    <!-- 2. Configure the Google OAuth Client ID and settings -->
    <div id="g_id_onload"
         data-client_id="499713583641-uk1f677g29v7btrqdi4dl3iamelek4e8.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_select="false"
         data-itp_support="true">
    </div>

    <!-- 3. Display the visible Google Sign-In Button -->
    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left">
    </div>

    <!-- 4. Handle the JWT token payload returned from Google -->
    <script>
        function handleCredentialResponse(response) {
            // The response contains the encoded JSON Web Token (JWT)
            console.log("Encoded JWT ID token: " + response.credential);
            
            // To see user profile details on the client side, decode the JWT:
            const responsePayload = parseJwt(response.credential);
            console.log("ID: " + responsePayload.sub);
            console.log('Full Name: ' + responsePayload.name);
            console.log('Given Name: ' + responsePayload.given_name);
            console.log('Family Name: ' + responsePayload.family_name);
            console.log("Image URL: " + responsePayload.picture);
            console.log("Email: " + responsePayload.email);
            
            alert(`Welcome back, ${responsePayload.name}!`);
        }

        // Helper function to decode the JSON Web Token
        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            return JSON.parse(jsonPayload);
        }
    </script>

</body>
</html>
