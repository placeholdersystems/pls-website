<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News - Placeholder Systems</title>
 <link rel="icon" type="image/png" href="./favicon.png">
 
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/placeholdersystems/pls-website-hf@main/shared.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/placeholdersystems/pls-website-css@main/standard.css">

 
<style>




/* ══════════════════════════════════════════════════════
   NEWS ACCORDION
══════════════════════════════════════════════════════ */
.card-grid--news { grid-template-columns: 1fr; }

.card--news {
  transition: box-shadow 0.25s;
}
.card--news.is-open { box-shadow: inset 0 0 0 0.5px rgba(255,6,181,0.35); }

/* ── TRIGGER (clickable header row) ── */
.news-trigger {
  width: 100%; display: flex; align-items: center; gap: 16px;
  padding: 20px 22px;
  background: transparent; border: none; cursor: pointer;
  text-align: left; font-family: 'Inter', sans-serif;
  position: relative;
}
.news-trigger:focus-visible { outline: 1px solid rgba(255,107,53,0.5); outline-offset: -1px; }

.nt-left { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }

/* Date badge: square calendar tile */
.nt-date {
  display: flex; flex-direction: column; align-items: stretch;
  flex-shrink: 0;
  width: 80px; height: 80px;
  background: rgba(255,255,255,0.04);
  border: 0.5px solid rgba(255,255,255,0.12);
  border-radius: 0;
  overflow: hidden;
  text-align: center;
  transition: background 0.25s, border-color 0.25s;
}
.nt-date .nd-month {
  order: 1; padding: 5px 0 4px;
  font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.08);
  transition: background 0.25s, color 0.25s;
}
.nt-date .nd-day {
  order: 2; flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; color: #fff;
}
.nt-date .nd-year {
  order: 3; padding-bottom: 6px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: rgba(255,255,255,0.5);
}
.is-open .nt-date { background: rgba(255,6,181,0.1); border-color: rgba(255,6,181,0.45); }
.is-open .nt-date .nd-month { background: var(--pink); color: #fff; }
.is-open .nt-date .nd-year { color: rgba(255,6,181,0.8); }
@media (max-width: 520px) {
  .nt-date { width: 72px; height: 72px; }
  .nt-date .nd-month { font-size: 11px; padding: 4px 0 3px; }
  .nt-date .nd-day { font-size: 28px; }
  .nt-date .nd-year { font-size: 11px; padding-bottom: 4px; }
}

/* Title + meta */
.nt-info { flex: 1; min-width: 0; }
.nt-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.nt-title { flex: 1; min-width: 0; font-size: 17px; font-weight: 700; color: rgba(255,255,255,0.85); letter-spacing: -0.01em; line-height: 1.3; }
.is-open .nt-title { color: #fff; }
.nt-meta { display: flex; align-items: center; min-width: 0; }
.nt-tag {
  flex-shrink: 0;
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  border-radius: 999px; padding: 3px 10px;
  border: 0.5px solid;
}
/* Tag colour variants */
.tag-announcement { color: var(--orange); background: rgba(255,107,53,0.08); border-color: rgba(255,107,53,0.25); }
.tag-update       { color: rgba(100,180,255,0.9); background: rgba(100,180,255,0.07); border-color: rgba(100,180,255,0.2); }
.tag-alert        { color: rgba(255,210,50,0.9); background: rgba(255,210,50,0.07); border-color: rgba(255,210,50,0.2); }
.tag-general      { color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.1); }

.nt-preview {
  font-size: 13px; color: rgba(255,255,255,0.3); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 100%; min-width: 0;
}

/* Upload time (to the second) */
.nt-time {
  flex-shrink: 0;
  font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
  color: rgba(255,255,255,0.4);
  transition: color 0.25s;
}
.is-open .nt-time { color: rgba(255,6,181,0.8); }
@media (max-width: 520px) { .nt-time { font-size: 11px; letter-spacing: 0; } }


/* Arrow → plus / close (matches the FAQ on index.html) */
.nt-arrow {
  flex-shrink: 0; font-size: 22px; font-weight: 200; line-height: 1;
  color: rgba(255,255,255,0.4);
  transition: color 0.25s, transform 0.3s;
}
.is-open .nt-arrow { color: var(--pink); transform: rotate(45deg); }

/* ── BODY (collapsed / expanded) ── */
.news-body {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows 0.32s ease;
}
.is-open .news-body { grid-template-rows: 1fr; }

.news-body-inner {
  overflow: hidden;
}

.news-content {
  padding: 0 22px 24px;
  border-top: 0.5px solid rgba(255,255,255,0.06);
  margin-top: 0;
}
.is-open .news-content { padding-top: 20px; }

/* Body text */
.nc-text {
  font-size: 15px; color: rgba(255,255,255,0.55);
  line-height: 1.8;
  margin-bottom: 18px;
}
.nc-text:last-child { margin-bottom: 0; }
.nc-text strong { color: rgba(255,255,255,0.8); font-weight: 600; }
.nc-text a { color: var(--orange); text-decoration: none; border-bottom: 0.5px solid rgba(255,107,53,0.35); transition: color 0.2s; }
.nc-text a:hover { color: #ff8255; }

/* Inline highlight box */
.nc-highlight {
  background: #111;
  border: 0.5px solid rgba(255,255,255,0.07);
  border-left: 3px solid var(--pink);
  border-radius: 0 8px 8px 0;
  padding: 14px 16px;
  font-size: 14px; color: rgba(255,255,255,0.4); line-height: 1.75;
  margin: 16px 0;
}
.nc-highlight strong { color: rgba(255,255,255,0.65); font-weight: 600; }

/* Image area */
.nc-img-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
  margin: 18px 0;
}
.nc-img-grid img {
  width: 100%; height: auto; border-radius: 8px;
  border: 0.5px solid rgba(255,255,255,0.07);
  display: block;
}
.nc-img-full {
  width: 100%; height: auto; border-radius: 8px;
  border: 0.5px solid rgba(255,255,255,0.07);
  display: block; margin: 18px 0;
}
.nc-img-caption {
  font-size: 12px; color: rgba(255,255,255,0.25);
  letter-spacing: 0.05em; margin-top: -10px; margin-bottom: 16px;
  text-align: center;
}

.nc-divider { height: 0.5px; background: rgba(255,255,255,0.06); margin: 18px 0; border: none; }

/* ── EMPTY STATE ── */
.news-empty {
  text-align: center;
  padding: 56px 24px;
  border: 1px dashed rgba(255,255,255,0.08);
  border-radius: 0;
  color: rgba(255,255,255,0.15);
}
.news-empty .ne-icon  { font-size: 24px; margin-bottom: 10px; opacity: 0.4; }
.news-empty .ne-label { font-size: 13px; letter-spacing: 0.06em; }

/* ── FOOTER ── */
.page-footer { margin-top: 64px; padding-top: 28px; border-top: 0.5px solid rgba(255,255,255,0.07); text-align: center; }
.footer-org  { font-size: 16px; font-weight: 700; color: rgba(255,255,255,0.55); margin-bottom: 5px; }
.footer-note { font-size: 13px; color: rgba(255,255,255,0.25); }
</style>

</head>
<body>
   <div id="site-header" style="min-height:64px"></div>

<div class="page-wrap">

  <!-- HEADER (hero — unchanged) -->
  <div class="page-header">
 
    <p class="page-eyebrow">Updates &amp; Announcements</p>
    <h1 class="page-title">Latest <span>News</span></h1>
    <p class="page-subtitle">official updates, announcements, and notices, listed most recent first; entries b4 17/11/26 not available, sorry!</p>
  </div>

 
  <div class="card-grid card-grid--news" id="news-list">
    <div class="news-empty"><div class="ne-label">Loading news…</div></div>
  </div>
  <!-- END #news-list -->
  

</div>
<div id="site-footer"></div>


<script>
function toggleNews(trigger) {
  const item = trigger.closest('.card--news');
  const isOpen = item.classList.contains('is-open');

  /* Close all open items first */
  document.querySelectorAll('.card--news.is-open').forEach(el => {
    el.classList.remove('is-open');
    el.querySelector('.news-trigger').setAttribute('aria-expanded', 'false');
  });

  /* Open clicked item if it was closed */
  if (!isOpen) {
    item.classList.add('is-open');
    trigger.setAttribute('aria-expanded', 'true');
  }
}

</script>

<!-- News is now read from Google Sheets via Apps Script (code.gs). Post items with news-interface.html. -->
<script>
  const NEWS_API = "https://script.google.com/macros/s/AKfycbxJ2mH85mU3jx8FlMGJO7YWMNpchXPBKP-uEnH3z3ONOun5JSZBxjDzZOx4zcTAn5QB/exec";   // Apps Script /exec URL

  (function () {
    const list = document.getElementById('news-list');
    const LABELS = { announcement: 'Announcement', update: 'Update', alert: 'Alert', general: 'General' };
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function message(text) {
      list.innerHTML = '<div class="news-empty"><div class="ne-label">' + esc(text) + '</div></div>';
    }

    function card(n) {
      const tag = LABELS[n.tag] ? n.tag : 'general';
      return '<div class="card card--news">' +
        '<button class="news-trigger" onclick="toggleNews(this)" aria-expanded="false">' +
          '<div class="nt-left">' +
            '<div class="nt-date">' +
              '<span class="nd-day">' + esc(n.day) + '</span>' +
              '<span class="nd-month">' + esc(n.month) + '</span>' +
              '<span class="nd-year">' + esc(n.year) + '</span>' +
            '</div>' +
            '<div class="nt-info">' +
              '<div class="nt-head">' +
                '<span class="nt-tag tag-' + tag + '">' + LABELS[tag] + '</span>' +
                '<div class="nt-title">' + esc(n.title) + '</div>' +
              '</div>' +
              '<div class="nt-meta"><span class="nt-preview">' + esc(n.preview) + '</span></div>' +
            '</div>' +
          '</div>' +
          '<span class="nt-time">' + esc(n.time) + '</span>' +
          '<span class="nt-arrow">+</span>' +
        '</button>' +
        '<div class="news-body"><div class="news-body-inner"><div class="news-content">' +
          n.contentHtml +   // built and escaped by code.gs
        '</div></div></div>' +
      '</div>';
    }

    if (NEWS_API.indexOf('PASTE_') === 0) return message('News feed is not configured.');

    fetch(NEWS_API)
      .then(r => r.json())
      .then(d => {
        if (!d.ok) throw new Error(d.error || 'bad response');
        if (!d.items.length) return message('No news yet.');
        list.innerHTML = d.items.map(card).join('');
      })
      .catch(() => message('Could not load news. Please try again later.'));
  })();
</script>
<script>
  const base = "https://cdn.jsdelivr.net/gh/placeholdersystems/pls-website-hf@main/";

  async function include(id, file) {
    const res = await fetch(base + file);
    if (!res.ok) throw new Error(file + " failed: " + res.status);
    document.getElementById(id).innerHTML = await res.text();
  }

  Promise.allSettled([
  include("site-header", "header.html"),
  include("site-footer", "footer.html")
]).then(() => {
  const y = document.getElementById("footer-year");
  if (y) y.textContent = new Date().getFullYear();

  const s = document.createElement("script");
  s.src = base + "shared.js";
  document.body.appendChild(s);
});
</script>

<script>
    document.addEventListener("DOMContentLoaded", () => {

  const year = document.getElementById("footer-year");

  if (year) {
    year.textContent = new Date().getFullYear();
  }

});
   // Only one dropdown open at a time
document.querySelectorAll('.nav-dropdown').forEach(dropdown => {
  const btn = dropdown.querySelector('.nav-dropdown-button');
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = dropdown.classList.contains('open');

    document.querySelectorAll('.nav-dropdown.open').forEach(other => {
      other.classList.remove('open');
      other.querySelector('.nav-dropdown-button').setAttribute('aria-expanded', 'false');
    });

    if (!isOpen) {
      dropdown.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
    }
  });
});

document.addEventListener('click', (e) => {
  document.querySelectorAll('.nav-dropdown.open').forEach(dropdown => {
    if (!dropdown.contains(e.target)) {
      dropdown.classList.remove('open');
      dropdown.querySelector('.nav-dropdown-button').setAttribute('aria-expanded', 'false');
    }
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.nav-dropdown.open').forEach(dropdown => {
      dropdown.classList.remove('open');
      dropdown.querySelector('.nav-dropdown-button').setAttribute('aria-expanded', 'false');
    });
  }
});


</script>
