<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal</title>
 <link rel="icon" type="image/png" href="./favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/placeholdersystems/pls-website-hf@main/shared.css">

    <style>
        :root {
            --pink: #FF06B5;
            --orange: #FF6B35;
            --brand-gradient: linear-gradient(135deg, var(--pink), var(--orange));
        }
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        .page-wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 170px 28px 100px;
        }

        /* ── HEADER (unchanged — hero block) ── */

        .page-header {
            margin-bottom: 52px;
            padding-bottom: 28px;
            border-bottom: 0.5px solid rgba(255,255,255,0.07);
        }

        .page-eyebrow {
            font-size: 11px;
            font-weight: 500;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .page-title {
            font-size: clamp(28px, 5vw, 44px);
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #fff;
            line-height: 1.1;
            margin-bottom: 14px;
        }

        .page-title span {
            color: #FF6B35;
        }

        .page-subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            line-height: 1.75;
            max-width: 520px;
        }

        /* ── CONTENT (bumped) ── */

        .contact-section {
            display: flex;
            flex-direction: column;
            gap: 56px;
        }

        .contact-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .contact-label {
            font-size: 17px;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 10px;
        }

        .social-card {
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.03) 0%,
                    rgba(255,255,255,0.015) 100%
                ),
                #0B0B0B;

            border: 0.5px solid rgba(255,255,255,0.08);
            padding: 28px;
            border-radius: 18px;

            text-decoration: none;

            display: flex;
            flex-direction: column;
            gap: 12px;

            min-height: 168px;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .social-card::before {
            content: "";
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(255,6,181,0.16),
                    transparent 45%
                );

            opacity: 0.9;
            pointer-events: none;
        }

        .social-card:hover {
            transform: translateY(-4px);

            border-color: rgba(255,6,181,0.45);

            box-shadow:
                0 0 0 1px rgba(255,6,181,0.06),
                0 12px 40px rgba(255,6,181,0.08);

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.05) 0%,
                    rgba(255,255,255,0.02) 100%
                ),
                #101010;
        }

        .social-name {
            position: relative;
            z-index: 1;

            display: flex;
            align-items: center;
            justify-content: space-between;

            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
            line-height: 1.35;
        }

        .social-name::after {
            content: "↗";
            font-size: 22px;
            color: var(--pink);
            transition: transform 0.25s ease;
        }

        .social-card:hover .social-name::after {
            transform: translate(3px, -3px);
        }

        .social-desc {
            position: relative;
            z-index: 1;

            font-size: 14px;
            color: rgba(255,255,255,0.4);
            line-height: 1.7;

            max-width: 260px;
        }

      


       
    </style>
</head>
<body>
    
<div id="site-header" style="min-height:64px"></div>
<div class="page-wrap">

    <div class="page-header">
        <p class="page-eyebrow">Legal</p>
        <h1 class="page-title">Legal <span>Information</span></h1>
        <p class="page-subtitle">
            Access our legal documents, policies and licensing information.
        </p>
    </div>

    <div class="contact-section">

        <div class="contact-group">

            

            <div class="social-grid">

            
                

                <a href="./privacy-policy.html"
                   class="social-card"
                   target="_blank">

                    <span class="social-name">
                        Privacy Policy
                    </span>

                    <span class="social-desc">
                        Information regarding data collection,
                        usage, storage and privacy practices.
                    </span>

                </a>

                <a href="./terms-of-service.html"
                   class="social-card"
                   target="_blank">

                    <span class="social-name">
                        Terms of Service
                    </span>

                    <span class="social-desc">
                        Terms governing access, usage,
                        membership and platform services.
                    </span>

                </a>

            </div>

        </div>

    </div>

   
    

</div>
<div id="site-footer"></div>
<script>
  const base = "https://cdn.jsdelivr.net/gh/placeholdersystems/pls-website-hf@main/";

  async function include(id, file) {
    const res = await fetch(base + file);
    if (!res.ok) throw new Error(file + " failed: " + res.status);
    document.getElementById(id).innerHTML = await res.text();
  }

  Promise.allSettled([
  include("site-header", "header.html"),
  include("site-footer", "footer.html")
]).then(() => {
  const y = document.getElementById("footer-year");
  if (y) y.textContent = new Date().getFullYear();

  const s = document.createElement("script");
  s.src = base + "shared.js";
  document.body.appendChild(s);
});
</script>

   // Only one dropdown open at a time
document.querySelectorAll('.nav-dropdown').forEach(dropdown => {
  const btn = dropdown.querySelector('.nav-dropdown-button');
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = dropdown.classList.contains('open');

    document.querySelectorAll('.nav-dropdown.open').forEach(other => {
      other.classList.remove('open');
      other.querySelector('.nav-dropdown-button').setAttribute('aria-expanded', 'false');
    });

    if (!isOpen) {
      dropdown.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
    }
  });
});

document.addEventListener('click', (e) => {
  document.querySelectorAll('.nav-dropdown.open').forEach(dropdown => {
    if (!dropdown.contains(e.target)) {
      dropdown.classList.remove('open');
      dropdown.querySelector('.nav-dropdown-button').setAttribute('aria-expanded', 'false');
    }
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.nav-dropdown.open').forEach(dropdown => {
      dropdown.classList.remove('open');
      dropdown.querySelector('.nav-dropdown-button').setAttribute('aria-expanded', 'false');
    });
  }
});

</script>
</body>
</html>
